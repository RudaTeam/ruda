[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/RudaTeam/ruda"
publish = false

[workspace.dependencies]
ruda_render = { path = "crates/ruda_render" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
pollster = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tracy = "0.12.0"
wgpu = "30.0.1"
winit = "0.30.13"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The game is unplayable at opt-level 0: optimize our code a little and dependencies fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

# Shipped builds.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
