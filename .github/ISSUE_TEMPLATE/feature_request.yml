name: Идея
description: Предложить фичу или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает
      description: Чего не хватает или что неудобно — игроку, моддеру или разработчику.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Что предлагаете
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Какие ещё варианты рассматривали.
