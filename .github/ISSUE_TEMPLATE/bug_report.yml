name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `ruda --gpu-backend gl`
        2. …
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a commit hash
  - type: textarea
    id: system
    attributes:
      label: System
      description: OS, CPU and GPU. The `GPU ready …` line from the log helps a lot.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Output of the game. Set `RUST_LOG=debug` for more detail.
      render: text
