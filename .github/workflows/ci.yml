name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: cargo fmt --all --check

  policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Licenses, advisories, sources, and the wgpu/winit wrapper bans.
      - run: cargo deny check
      # deny.toml cannot express "not even transitively", so check the server tree directly.
      - name: Dedicated server has no graphics or windowing
        run: |
          if cargo tree -p ruda-server -e normal --target all --prefix none | grep -E '^(wgpu|winit) '; then
            echo "::error::ruda-server must not depend on graphics or windowing crates"
            exit 1
          fi

  # Lint and test natively on every supported platform.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04 }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: Windows x86_64, os: windows-2025 }
          - { name: macOS aarch64, os: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  # Targets without a native runner: build only.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, os: macos-15, target: x86_64-apple-darwin }
          - { name: Windows aarch64, os: windows-2025, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      - run: cargo build --workspace --target ${{ matrix.target }}

  # The client must open a window and present the menu and the world on every
  # platform. Runners have no GPU, so Linux renders with Mesa (lavapipe,
  # llvmpipe) under Xvfb and Windows with WARP.
  smoke:
    name: Smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04, backends: vulkan gl }
          - { name: Linux aarch64, os: ubuntu-24.04-arm, backends: vulkan gl }
          - { name: Windows x86_64, os: windows-2025, backends: dx12 }
          - { name: macOS aarch64, os: macos-15, backends: metal }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install software rendering
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 \
            libegl1 libegl-mesa0 libgl1-mesa-dri libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
      - run: cargo build -p ruda
      - name: Present frames
        shell: bash
        timeout-minutes: 5
        run: |
          wrap=()
          if [ "$RUNNER_OS" = Linux ]; then wrap=(xvfb-run -a); fi
          for backend in ${{ matrix.backends }}; do
            echo "::group::$backend: main menu"
            "${wrap[@]}" target/debug/ruda --gpu-backend "$backend" --exit-after-frames 30
            echo "::endgroup::"
            echo "::group::$backend: world"
            "${wrap[@]}" target/debug/ruda --gpu-backend "$backend" --singleplayer --exit-after-frames 60
            echo "::endgroup::"
          done

  # The one required check for merging into main: it stays the same when jobs
  # or matrix entries above are added, renamed or removed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [fmt, policy, test, build, smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
