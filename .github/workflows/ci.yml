name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: cargo fmt --all --check

  policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Licenses, advisories, sources, and the wgpu/winit wrapper bans (ADR-0002, ADR-0003).
      - run: cargo deny check
      # deny.toml cannot express "not even transitively", so check the server tree directly.
      - name: Dedicated server has no graphics or windowing
        run: |
          if cargo tree -p ruda-server -e normal --target all --prefix none | grep -E '^(wgpu|winit) '; then
            echo "::error::ruda-server depends on graphics or windowing crates (ADR-0002)"
            exit 1
          fi

  # Tier 1 platforms (ADR-0005): lint and test natively.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04 }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: Windows x86_64, os: windows-2025 }
          - { name: macOS aarch64, os: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  # Targets without a native runner: build only.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, os: macos-15, target: x86_64-apple-darwin }
          - { name: Windows aarch64, os: windows-2025, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      - run: cargo build --workspace --target ${{ matrix.target }}
